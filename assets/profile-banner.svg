    <circle cx="861" cy="79" r="4" fill="#67C7D4"/>
    <circle cx="877" cy="79" r="4" fill="#9DA7B3"/>
    <circle cx="893" cy="79" r="4" fill="#9DA7B3"/>
    <g font-family="monospace" font-size="15">
