<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Doan Trung Kien — Java Backend Engineer</title>
  <desc id="description">Doan Trung Kien, Java Backend Engineer in Vietnam. An animated terminal illustrates building backend services.</desc>
  <style>
    .terminal { animation: float 6s ease-in-out infinite; }
    .cursor { animation: blink 1.4s steps(2, jump-none) infinite; }
    .signal { animation: signal 4s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes blink { to { opacity: 0; } }
    @keyframes signal { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .terminal, .cursor, .signal { animation: none; } }
  </style>
  <rect class="surface" width="1200" height="340" rx="16" fill="#0D1117"/>
  <path class="side" d="M810 0H1184C1192.84 0 1200 7.163 1200 16V324C1200 332.837 1192.84 340 1184 340H810V0Z" fill="#161B22"/>
