  <text x="54" y="151" fill="#E6EDF3" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700" letter-spacing="-2">Doan Trung Kien</text>
  <text x="58" y="199" fill="#9DA7B3" font-family="Arial, Helvetica, sans-serif" font-size="26">Java Backend Engineer</text>
